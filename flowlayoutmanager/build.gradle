plugins {
    alias(libs.plugins.android.library)
    id 'maven-publish'
    id 'signing'
}

// Maven Central and GitHub Packages serve the library as io.github.simonebortolin,
// JitPack (which sets JITPACK) as com.github.simonebortolin.
group = System.getenv('JITPACK') ? 'com.github.simonebortolin' : 'io.github.simonebortolin'
version = VERSION_NAME

android {
    namespace = 'com.xiaofeng.flowlayoutmanager'
    compileSdk = 37

    defaultConfig {
        minSdk = MIN_SDK as int
    }

    testOptions {
        // Unit tests run on the JVM with Robolectric, no emulator needed.
        unitTests.includeAndroidResources = true
        unitTests.all {
            // Robolectric reaches FileDescriptor internals (java.io fields and
            // jdk.internal.access.SharedSecrets), closed by default on JDK 17+.
            jvmArgs '--add-opens=java.base/java.io=ALL-UNNAMED',
                    '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
            // Required by Maven Central
            withJavadocJar()
        }
    }
}

dependencies {
    // FlowLayoutManager extends RecyclerView.LayoutManager, so RecyclerView is part of the public API.
    api libs.androidx.recyclerview

    testImplementation libs.junit
    testImplementation libs.androidx.test.ext.junit
    testImplementation libs.robolectric
}

afterEvaluate {
    publishing {
        publications {
            // Same library, GitHub Packages does not accept uppercase letters in the artifactId
            [release: 'FlowLayoutManager', github: 'flowlayoutmanager'].each { publicationName, publicationArtifactId ->
                create(publicationName, MavenPublication) {
                    from components.release
                    artifactId = publicationArtifactId

                    // Metadata required by Maven Central
                    pom {
                        name = 'FlowLayoutManager'
                        description = 'A RecyclerView LayoutManager that lays out views in flow style.'
                        url = 'https://github.com/simonebortolin/FlowLayoutManager'
                        licenses {
                            license {
                                name = 'GNU General Public License v3.0'
                                url = 'https://www.gnu.org/licenses/gpl-3.0.txt'
                            }
                        }
                        developers {
                            developer {
                                id = 'simonebortolin'
                                name = 'Simone Bortolin'
                                url = 'https://github.com/simonebortolin'
                            }
                        }
                        scm {
                            url = 'https://github.com/simonebortolin/FlowLayoutManager'
                            connection = 'scm:git:https://github.com/simonebortolin/FlowLayoutManager.git'
                            developerConnection = 'scm:git:ssh://git@github.com/simonebortolin/FlowLayoutManager.git'
                        }
                    }
                }
            }
        }
        repositories {
            // Maven layouts that CI uploads to Maven Central and GitHub Packages
            maven {
                name = 'central'
                url = layout.buildDirectory.dir('staging-deploy/central')
            }
            maven {
                name = 'github'
                url = layout.buildDirectory.dir('staging-deploy/github')
            }
        }
    }

    // Signed only when CI provides the key (ORG_GRADLE_PROJECT_signingKey and signingPassword),
    // GitHub Packages does not need the signatures
    def signingKey = findProperty('signingKey')
    if (signingKey) {
        signing {
            useInMemoryPgpKeys(signingKey, findProperty('signingPassword'))
            sign publishing.publications.release
        }
    }
}
