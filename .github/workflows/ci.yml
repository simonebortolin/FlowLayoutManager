name: CI

on:
  push:
    branches:
      - master
    # Documentation only changes (README, badges, screenshots) do not need a build or a release
    paths-ignore:
      - '**.md'
      - 'art/**'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'art/**'
  workflow_dispatch: # Allows manual trigger of the workflow

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: '17'
  # Robolectric needs JDK 21 to run on the latest Android SDKs
  TEST_JAVA_VERSION: '21'

# Stages: Resolve Version -> Test (lowest and latest Android SDK) -> Build library & sample app -> Tag & Release
# -> Publish to GitHub Packages and Maven Central, Javadoc to GitHub Pages
# The Test report job publishes the JUnit results of every SDK, also when the tests fail.
# Every stage must succeed for the next one to start.
jobs:
  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag_exists: ${{ steps.resolve.outputs.tag_exists }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read version from gradle.properties
        id: resolve
        shell: bash
        run: |
          VERSION=$(sed -n 's/^VERSION_NAME=\(.*\)$/\1/p' gradle.properties | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error file=gradle.properties::No VERSION_NAME found"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag $VERSION already present - skip release"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

          echo "### Version \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test (SDK ${{ matrix.sdk }})
    runs-on: ubuntu-latest
    needs: [version]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Android version the Robolectric unit tests run on: the lowest one Robolectric supports
        # (23, the library minSdk 21 is no longer supported by Robolectric) and the latest one.
        sdk: [23, 37]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.TEST_JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Select Robolectric SDK
        run: echo "sdk=${{ matrix.sdk }}" > flowlayoutmanager/src/test/resources/robolectric.properties

      - name: Test
        run: ./gradlew :flowlayoutmanager:testDebugUnitTest

      # Read by the report job
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-sdk${{ matrix.sdk }}
          path: flowlayoutmanager/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn

      - name: Upload HTML report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-sdk${{ matrix.sdk }}
          path: flowlayoutmanager/build/reports/tests/
          if-no-files-found: ignore

  report:
    name: Test report
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    permissions:
      contents: read
      actions: read # download the JUnit artifacts
      checks: write # publish a check run per SDK

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # One check run per junit-sdk<N> artifact, "Unit Tests Result (SDK <N>)"
      - name: Publish Unit Tests Result
        uses: dorny/test-reporter@v1
        with:
          name: Unit Tests Result (SDK $1)
          artifact: /junit-sdk(.*)/
          path: '**/*.xml'
          reporter: java-junit
          fail-on-error: true
          # Recent v1 releases default to the job summary only: create the check runs with their state
          use-actions-summary: false

  build:
    name: Build library & sample app
    runs-on: ubuntu-latest
    needs: [version, test]
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare signing key
        if: env.ANDROID_KEYSTORE_BASE64 != '' && github.event_name != 'pull_request'
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build
        env:
          # Sign the Maven artifacts outside pull requests, when a key is configured
          ORG_GRADLE_PROJECT_signingKey: ${{ github.event_name != 'pull_request' && secrets.SIGNING_KEY || '' }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          ./gradlew \
            :flowlayoutmanager:assembleRelease \
            :flowlayoutmanager:publishToMavenLocal \
            :flowlayoutmanager:publishReleasePublicationToCentralRepository \
            :flowlayoutmanager:publishGithubPublicationToGithubRepository \
            :app:assembleDebug \
            :app:assembleRelease

      - name: Package
        run: |
          mkdir -p dist
          cp flowlayoutmanager/build/outputs/aar/flowlayoutmanager-release.aar "dist/FlowLayoutManager-${VERSION}.aar"
          cp "flowlayoutmanager/build/staging-deploy/central/io/github/simonebortolin/FlowLayoutManager/${VERSION}/FlowLayoutManager-${VERSION}-javadoc.jar" \
            "dist/FlowLayoutManager-${VERSION}-javadoc.jar"

          # Signed release APK when a keystore is configured, debug APK otherwise
          # (an unsigned APK cannot be installed).
          APK="$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' -print -quit)"
          [ -n "$APK" ] || APK="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::No APK produced"
            exit 1
          fi
          cp "$APK" "dist/FlowLayoutManager-sample-${VERSION}.apk"
          ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: flowlayoutmanager-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error

      # Maven repository layouts (AAR, sources, javadoc, POM and signatures),
      # published as is to Maven Central (central/) and GitHub Packages (github/)
      - name: Upload Maven artifacts
        uses: actions/upload-artifact@v7
        with:
          name: maven-${{ env.VERSION }}
          path: flowlayoutmanager/build/staging-deploy/
          if-no-files-found: error

  release:
    name: Tag & Release
    runs-on: ubuntu-latest
    needs: [version, build]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    permissions:
      contents: write
      statuses: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: flowlayoutmanager-${{ env.VERSION }}
          path: release

      - name: Download Maven artifacts
        uses: actions/download-artifact@v8
        with:
          name: maven-${{ env.VERSION }}
          path: maven

      - name: Checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # A digest can appear only once: the GitHub Packages layout and the release
      # Javadoc jar share their files with the Maven Central layout.
      - name: Collect attestation subjects
        run: |
          find release maven -type f \( -name '*.aar' -o -name '*.apk' -o -name '*.jar' -o -name '*.pom' \) -exec sha256sum {} + \
            | awk '{ name = $2; sub(/.*\//, "", name); if (!seen[$1]++) print $1 "  " name }' > "$RUNNER_TEMP/subjects"
          cat "$RUNNER_TEMP/subjects"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: ${{ runner.temp }}/subjects

      - name: Tag release
        id: tag
        if: needs.version.outputs.tag_exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Create GitHub Release
        id: gh_release
        if: steps.tag.outcome == 'success'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          generate_release_notes: true
          files: release/*

      - name: Report release status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ needs.version.outputs.tag_exists }}" = "true" ]; then
            STATE=pending
            DESCRIPTION="Version $VERSION already released - bump VERSION_NAME in gradle.properties."
          elif [ "${{ steps.gh_release.outcome }}" = "success" ]; then
            STATE=success
            DESCRIPTION="Released $VERSION with library AAR and sample APK."
          else
            STATE=failure
            DESCRIPTION="Release failed with an unexpected error."
          fi
          gh api repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -f state="$STATE" \
            -f description="$DESCRIPTION" \
            -f context="release"

  pages:
    name: Publish Javadoc to GitHub Pages
    runs-on: ubuntu-latest
    needs: [version, release]
    if: needs.version.outputs.tag_exists != 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: flowlayoutmanager-${{ env.VERSION }}
          path: release

      # Same Javadoc jar shipped with the release and on Maven Central
      - name: Extract Javadoc
        run: |
          mkdir site
          unzip -q "release/FlowLayoutManager-${VERSION}-javadoc.jar" -d site
          rm -rf site/META-INF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-github:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: [version, release]
    if: needs.version.outputs.tag_exists != 'true'
    permissions:
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Download Maven artifacts
        uses: actions/download-artifact@v8
        with:
          name: maven-${{ env.VERSION }}
          path: maven

      # Same files attested in the release job, uploaded as Gradle does:
      # artifacts first, maven-metadata.xml last.
      - name: Upload to GitHub Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd maven/github
          { find . -type f ! -name 'maven-metadata.xml*' | sort; find . -type f -name 'maven-metadata.xml*' | sort; } > "$RUNNER_TEMP/files"
          while read -r FILE; do
            echo "Uploading ${FILE#./}"
            curl --fail-with-body -sS -u "${{ github.actor }}:$GH_TOKEN" --upload-file "$FILE" \
              "https://maven.pkg.github.com/${{ github.repository }}/${FILE#./}"
          done < "$RUNNER_TEMP/files"

  publish-central:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    needs: [version, release]
    if: needs.version.outputs.tag_exists != 'true'
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

    steps:
      - name: Download Maven artifacts
        uses: actions/download-artifact@v8
        with:
          name: maven-${{ env.VERSION }}
          path: maven

      # Central Portal API: https://central.sonatype.org/publish/publish-portal-api/
      - name: Upload to Maven Central
        run: |
          if [ -z "$CENTRAL_USERNAME" ] || [ -z "$CENTRAL_PASSWORD" ]; then
            echo "::warning::MAVEN_CENTRAL_USERNAME and MAVEN_CENTRAL_PASSWORD not configured - skip Maven Central"
            exit 0
          fi
          if ! find maven/central -name '*.asc' | grep -q .; then
            echo "::error::Maven artifacts are not signed - configure SIGNING_KEY and SIGNING_PASSWORD"
            exit 1
          fi

          # Maven Central manages maven-metadata.xml itself
          (cd maven/central && zip -qr "$RUNNER_TEMP/bundle.zip" . -x '*maven-metadata.xml*')
          AUTH="Authorization: Bearer $(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)"
          DEPLOYMENT=$(curl --fail-with-body -sS -H "$AUTH" -F "bundle=@$RUNNER_TEMP/bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=${{ github.event.repository.name }}-$VERSION&publishingType=AUTOMATIC")
          echo "Deployment $DEPLOYMENT"

          # Wait for the validation, the publication itself can take a while longer
          for _ in $(seq 60); do
            STATUS=$(curl --fail-with-body -sS -X POST -H "$AUTH" "https://central.sonatype.com/api/v1/publisher/status?id=$DEPLOYMENT")
            STATE=$(echo "$STATUS" | jq -r .deploymentState)
            echo "State: $STATE"
            case "$STATE" in
              PUBLISHING|PUBLISHED)
                echo "### Maven Central: \`$STATE\`" >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              FAILED)
                echo "$STATUS" | jq .
                echo "::error::Maven Central rejected the deployment $DEPLOYMENT"
                exit 1
                ;;
            esac
            sleep 20
          done
          echo "::error::Maven Central did not validate the deployment $DEPLOYMENT in time"
          exit 1
